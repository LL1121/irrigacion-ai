# Producción on-prem (LAN / Tailscale)
# Uso:
#   cp .env.example .env
#   ./scripts/deploy.sh              # todo
#   ./scripts/deploy_api.sh          # solo API
#   ./scripts/deploy_frontend.sh     # solo PWA
#
# Compose lee variables con: docker compose --env-file .env -f docker-compose.prod.yml ...

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: irrigacion_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-irrigacion_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/app/database/audit.sql:/docker-entrypoint-initdb.d/02_audit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - irrigacion_internal
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: irrigacion-api:prod
    container_name: irrigacion_api_prod
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-irrigacion_db}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      CHAT_MODEL: ${CHAT_MODEL:-llama-3.3-70b-versatile}
      LLM_REQUEST_MAX_TOKENS: ${LLM_REQUEST_MAX_TOKENS:-9000}
      LLM_RAG_MAX_TOKENS: ${LLM_RAG_MAX_TOKENS:-3500}
      LLM_HISTORY_MAX_TOKENS: ${LLM_HISTORY_MAX_TOKENS:-1800}
      LLM_USER_MAX_TOKENS: ${LLM_USER_MAX_TOKENS:-1500}
      LLM_SKILL_RESULT_MAX_TOKENS: ${LLM_SKILL_RESULT_MAX_TOKENS:-1200}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      OCR_MODEL: ${OCR_MODEL:-gemini-flash-latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SKILL_WORKSPACE_DIR: /var/lib/irrigacion/skills
      SKILL_SANDBOX_IMAGE: ${SKILL_SANDBOX_IMAGE:-skill-sandbox-image}
      # inline = mismo proceso API (sin Docker). sandbox = contenedor efímero.
      SKILL_EXECUTION_MODE: ${SKILL_EXECUTION_MODE:-inline}
      SKILL_HTTP_ALLOW_SUFFIXES: ${SKILL_HTTP_ALLOW_SUFFIXES:-irrigacion.gov.ar,cloud.irrigacion.gov.ar}
      # Build de la PWA (desktop-app/dist) montado como volumen de solo lectura.
      # Generalo antes del deploy con: cd desktop-app && npm run build
      FRONTEND_DIST_DIR: /app/static/dist
      UPDATES_DIR: /app/static/updates
      # Google OAuth (login + Calendar / Gmail / Drive)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://ia.irrigacionmalargue.net/api/auth/google/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_JWT_TTL_HOURS: ${APP_JWT_TTL_HOURS:-168}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://ia.irrigacionmalargue.net}
    ports:
      - "${API_HOST_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ${SKILL_HOST_DIR:-/var/lib/irrigacion/skills}:/var/lib/irrigacion/skills
      - /var/run/docker.sock:/var/run/docker.sock
      - ./desktop-app/dist:/app/static/dist:ro
      - ${UPDATES_HOST_DIR:-./updates}:/app/static/updates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    # Tailscale MagicDNS a veces no resuelve registries/APIs externas desde el contenedor.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - irrigacion_internal
      # Red de nginx / reverse-proxy (externa). Evita tener que hacer
      # `docker network connect proxy-network irrigacion_api_prod` a mano.
      - proxy
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-0}"

  # Landing + política de privacidad (dominio institucional irrigacionmalargue.net)
  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    image: irrigacion-site:prod
    container_name: irrigacion_site_prod
    ports:
      - "${SITE_HOST_BIND:-0.0.0.0}:${SITE_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - irrigacion_internal
      - proxy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  irrigacion_internal:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}
